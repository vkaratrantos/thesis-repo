controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # 1. Arm Controller
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # 2. Gripper Controller (Main - Only the leader joint)
    gripper_controller:
      type: position_controllers/GripperActionController

    # 3. Mimic Controller (Followers - Controlled by Python script)
    mimic_controller:
      type: forward_command_controller/ForwardCommandController

    # 4. Joint State Broadcaster
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# --- Ρυθμίσεις Arm (Με δυνατά PIDs για Gazebo) ---
arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    gains:
      joint1: {p: 10000.0, i: 0.0, d: 500.0}
      joint2: {p: 50000.0, i: 1.0, d: 1000.0} 
      joint3: {p: 30000.0, i: 1.0, d: 500.0}
      joint4: {p: 10000.0, i: 0.0, d: 200.0}
      joint5: {p: 1000.0,  i: 0.0, d: 50.0}
      joint6: {p: 500.0,   i: 0.0, d: 10.0}
      joint7: {p: 100.0,   i: 0.0, d: 1.0}

# --- Ρυθμίσεις Main Gripper ---
gripper_controller:
  ros__parameters:
    joint: endeffector_gripper
    action_monitor_rate: 20.0
    allow_stalled: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
    # PID για το κεντρικό γρανάζι
    gains:
      endeffector_gripper: {p: 2000.0, i: 0.0, d: 50.0}

# --- Ρυθμίσεις Mimic Fingers (Αυτά που ακολουθούν) ---
mimic_controller:
  ros__parameters:
    interface_name: position
    joints:
      - gripperbase_to_armgearleft
      - gripperbase_to_armsimpleright
      - gripperbase_to_armsimpleleft
      - armgearright_to_fingerright
      - armgearleft_to_fingerleft
